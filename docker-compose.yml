x-app: &app
  build:
    context: .
    target: runtime
    args:
      TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
  image: brainscanai:latest
  volumes:
    - ./data:/app/data
    - ./reports:/app/reports
    - ./configs:/app/configs:ro
  environment:
    TORCH_HOME: /app/data/.torch_cache   #

services:
  inspect:
    <<: *app
    command: python scripts/inspect_data.py
  features:
    <<: *app
    command: python scripts/extract_features.py
  cluster:
    <<: *app
    command: python scripts/run_clustering.py
  semi:
    <<: *app
    command: python scripts/run_semi_supervised.py
  scaleup:
    <<: *app
    command: python scripts/estimate_scale_up.py
  pipeline:                      # tout enchaîner : qualité -> features -> clustering -> semi-sup. -> budget
    <<: *app
    command: >
      sh -c "python scripts/inspect_data.py &&
             python scripts/extract_features.py &&
             python scripts/run_clustering.py &&
             python scripts/run_semi_supervised.py &&
             python scripts/estimate_scale_up.py"
  gpu-check:                    
    <<: *app
    command: python scripts/check_gpu.py
  demo-data:
    <<: *app
    command: python scripts/make_demo_data.py

  test:
    build:
      context: .
      target: dev
    image: brainscanai:dev
    command: sh -c "ruff check src tests scripts && pytest"

  jupyter:
    build:
      context: .
      target: dev
    image: brainscanai:dev
    command: jupyter lab --ip=0.0.0.0 --no-browser --allow-root --IdentityProvider.token='' --ServerApp.root_dir=/app
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/app
