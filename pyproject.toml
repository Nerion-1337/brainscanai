[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainscanai"
version = "1.0.0"
description = "Exploration semi-supervisée d'IRM cérébrales (projet BrainScanAI - CurelyticsIA)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E402", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
