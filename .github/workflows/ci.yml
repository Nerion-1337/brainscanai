name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: "Installer (sans torch, les tests PyTorch sont ignorés automatiquement)"
        run: uv sync --frozen --group dev --no-install-package torch --no-install-package torchvision
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Tests
        run: uv run pytest
      - name: Validation des notebooks (JSON + absence de sorties)
        run: uv run python scripts/check_notebooks.py

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (cible dev) avec cache GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
