name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Installer les dépendances (sans torch : tests CPU légers)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pillow matplotlib seaborn pyyaml tqdm pytest ruff nbformat
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests (les tests torch sont ignorés si torch est absent)
        run: pytest
      - name: Validation des notebooks (JSON + absence de sorties)
        run: python scripts/check_notebooks.py
